<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>litefactory — Projects / nginx-router</title>
<style>
  :root{
    --bg:#ffffff;--surface:#f6f7f8;--surface-2:#eef0f2;--border:#e1e4e8;
    --text:#1b1e23;--muted:#6b7280;
    --graphite:#2f333a;--graphite-2:#3a3f47;--graphite-3:#565c66;
    --graphite-text:#e7e9eb;--graphite-muted:#9aa1ab;
    --accent:#3d8f7f;--success:#2f8f4e;--warning:#a8791f;--error:#b23b2e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;min-height:100vh;}
  aside.sidebar{width:212px;flex:0 0 212px;background:var(--graphite);color:var(--graphite-text);
    display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;align-self:flex-start;}
  .sidebar-top{padding:20px 18px 16px;border-bottom:1px solid var(--graphite-2);}
  a.brand{font-weight:600;letter-spacing:.02em;color:var(--graphite-text);text-decoration:none;font-size:15px;display:block;}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--graphite-muted);margin-top:8px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;}
  nav.nav-primary{padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
  nav.nav-primary a{padding:9px 12px;border-radius:6px;color:var(--graphite-muted);text-decoration:none;font-size:14px;
    border-left:3px solid transparent;}
  nav.nav-primary a.active{background:var(--graphite-2);color:#fff;border-left-color:var(--accent);}
  nav.nav-primary a:hover{background:var(--graphite-2);color:#fff;}
  .sidebar-spacer{flex:1;}
  .sidebar-bottom{padding:10px;border-top:1px solid var(--graphite-2);display:flex;flex-direction:column;gap:2px;}
  .sidebar-bottom a{padding:8px 12px;border-radius:6px;color:var(--graphite-muted);text-decoration:none;font-size:13px;
    display:flex;align-items:center;gap:8px;}
  .sidebar-bottom a:hover{background:var(--graphite-2);color:#fff;}
  .sidebar-bottom a.active{background:var(--graphite-2);color:#fff;}
  .sidebar-bottom .icon{font-size:14px;}

  .main-wrap{flex:1;min-width:0;}
  main{padding:28px 32px;max-width:900px;margin:0 auto;}
  .breadcrumb{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .breadcrumb a{color:var(--muted);text-decoration:none;}
  .breadcrumb a:hover{color:var(--accent);}
  .breadcrumb .sep{margin:0 6px;}
  .breadcrumb .current{color:var(--text);}
  .list{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);}
  .row:last-child{border-bottom:none;}
  .row:hover{background:var(--surface);}
  .row .left{display:flex;align-items:center;gap:12px;}
  .row .issue{font-weight:500;font-size:14.5px;}
  .badge{font-size:12.5px;}
  .badge.fail{color:var(--error);}
  .row .meta{color:var(--muted);font-size:13px;}
  .row .arrow{color:var(--muted);margin-left:14px;}
  footer.note{margin-top:28px;color:var(--muted);font-size:12px;}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-top">
    <a class="brand" href="dashboard.html">litefactory</a>
    <div class="status"><span class="dot"></span> daemon running</div>
  </div>
  <nav class="nav-primary">
    <a href="projects.html" class="active">Projects</a>
  </nav>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-bottom">
    <a href="logs.html"><span class="icon">&#8801;</span> Daemon log</a>
    <a href="settings.html" class="gear"><span class="icon">&#9881;</span> Settings</a>
  </div>
</aside>

<div class="main-wrap">
<main>
  <div class="breadcrumb">
    <a href="projects.html">&larr; Projects</a><span class="sep">/</span><span class="current">nginx-router</span>
  </div>

  <div class="list">
    <a class="row" href="projects.html">
      <div class="left">
        <span class="badge fail">&#10007;</span>
        <div>
          <div class="issue">#3 &nbsp;nginx router bug</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;">
        <span class="meta">failed &middot; 1d ago</span>
        <span class="arrow">&rarr;</span>
      </div>
    </a>
  </div>

  <footer class="note">Clickdummy — static mockup, no live data. Part of the UI research brief for issue #11.</footer>
</main>
</div>

</body>
</html>
