<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>litefactory — Projects / side-project</title>
<style>
  :root{
    --bg:#16181c;--panel:#1f2226;--border:#2b2f36;--text:#e6e6e6;--muted:#8b9099;
    --accent:#5fb3a3;--success:#5fae6b;--warning:#d1a34c;--error:#c9614f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid var(--border);background:var(--panel);}
  a.brand{font-weight:600;letter-spacing:.02em;color:var(--text);text-decoration:none;font-size:15px;}
  .status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;}
  nav.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--panel);}
  nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-size:14px;
    border-bottom:2px solid transparent;}
  nav.tabs a.active{color:var(--text);border-bottom-color:var(--accent);}
  nav.tabs a:hover{color:var(--text);}
  main{padding:28px 24px;max-width:900px;margin:0 auto;}
  .breadcrumb{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .breadcrumb a{color:var(--muted);text-decoration:none;}
  .breadcrumb a:hover{color:var(--accent);}
  .breadcrumb .sep{margin:0 6px;}
  .breadcrumb .current{color:var(--text);}
  .empty{border:1px dashed var(--border);border-radius:8px;padding:40px 16px;text-align:center;
    color:var(--muted);font-size:14px;}
  footer.note{margin-top:28px;color:var(--muted);font-size:12px;}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="dashboard.html">litefactory</a>
  <div class="status"><span class="dot"></span> daemon running</div>
</header>

<nav class="tabs">
  <a href="projects.html" class="active">Projects</a>
  <a href="projects.html">Runs</a>
  <a href="logs.html">Logs</a>
  <a href="settings.html">Settings</a>
</nav>

<main>
  <div class="breadcrumb">
    <a href="projects.html">&larr; Projects</a><span class="sep">/</span><span class="current">side-project</span>
  </div>

  <div class="empty">No open sessions for this repo.</div>

  <footer class="note">Clickdummy — static mockup, empty-state example. Part of the UI research brief for issue #11.</footer>
</main>

</body>
</html>
