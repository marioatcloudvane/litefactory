name: Team content package

# Team content has its own release cadence. This workflow never publishes the
# application or writes repository branches; an operator deploys the artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: New stable team version (for example 1.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build immutable team release, then discovery index
        env:
          TEAM_VERSION: ${{ inputs.version }}
        run: go run ./cmd/team-publish --source teams/source --output teams --team go-team --version "$TEAM_VERSION"
      - name: Upload independently deployable content
        uses: actions/upload-artifact@v4
        with:
          name: team-content
          path: |
            teams/teams.json
            teams/releases/
          if-no-files-found: error
