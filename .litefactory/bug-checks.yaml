version: 1
phases:
  regression:
    commands:
      - argv: [go, build, ./...]
        timeout_seconds: 900
      # -timeout=0: internal/turn alone runs 15-20 minutes, past go test's
      # default 10-minute per-package limit, which failed every check.
      - argv: [go, test, -timeout=0, ./...]
        timeout_seconds: 3600
  focused:
    commands:
      - argv: [go, vet, ./...]
        timeout_seconds: 900
      - argv: [golangci-lint, run]
        timeout_seconds: 1200
  full:
    commands:
      - argv: [go, test, -race, -timeout=0, ./...]
        timeout_seconds: 3600
