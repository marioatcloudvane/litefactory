version: 1
phases:
  regression:
    commands:
      - argv: [go, build, ./...]
        timeout_seconds: 900
      # -timeout=0: internal/turn alone runs 15-20 minutes, past go test's
      # default 10-minute per-package limit, which failed every check.
      - argv: [go, test, -timeout=0, ./...]
        timeout_seconds: 3600
        # A failure is rerun for just its failing tests, on the repair and
        # then on main: flaky and pre-existing failures are shown in the
        # review instead of failing the check.
        rerun:
          failures: go-test
          argv: [go, test, -count=1, -timeout=0, -run, "{tests}", "{packages}"]
          timeout_seconds: 1800
  focused:
    commands:
      - argv: [go, vet, ./...]
        timeout_seconds: 900
      - argv: [golangci-lint, run]
        timeout_seconds: 1200
  full:
    commands:
      # make test runs every test with race coverage where concurrency is
      # (see Makefile); the blanket -race run took over an hour on internal/turn.
      # 86400 is the recipe maximum so a slow host never cuts it off.
      - argv: [make, test]
        timeout_seconds: 86400
        rerun:
          failures: go-test
          argv: [go, test, -race, -count=1, -timeout=0, -run, "{tests}", "{packages}"]
          timeout_seconds: 1800
